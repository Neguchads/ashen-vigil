name: GDScript static checks
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gdscript-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Check GDScript formatting and lint
        shell: bash
        run: |
          set -euo pipefail
          for dir in game/src game/tests game/tools; do
            if [ -d "$dir" ] && find "$dir" -name '*.gd' -print -quit | grep -q .; then
              gdformat --check "$dir"
              gdlint "$dir"
            fi
          done
